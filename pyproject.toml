[project]
name = "tabletop-tactician"
version = "0.1.0"
description = "An agentic Warhammer 40,000 matchup adviser: deterministic combat math plus an LLM that reasons over it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "wh40kdc>=1.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_tactician"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
