[project]
name = "tabletop-tactician"
version = "0.1.0"
description = "An agentic Warhammer 40,000 matchup adviser: deterministic combat math plus an LLM that reasons over it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "scipy>=1.18.0",
    "wh40kdc>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_tactician"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
# Line width before Ruff wraps. 88 is the tool default; 100-120 are common
# team choices. Signatures or calls longer than this wrap one item per line.
line-length = 120
