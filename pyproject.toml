[project]
name = "tabletop-tactician"
version = "0.1.0"
description = "An agentic Warhammer 40,000 matchup adviser: deterministic combat math plus an LLM that reasons over it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "scipy>=1.18.0",
    "wh40kdc>=1.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_tactician"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
